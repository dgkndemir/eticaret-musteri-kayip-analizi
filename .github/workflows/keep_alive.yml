name: Render Keep Alive

on:
  schedule:
    
    - cron: '*/12 * * * *'
  workflow_dispatch: 

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Render Backend
        run: |
          curl -s -i -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            "https://eticaret-musteri-kayip-analizi.onrender.com/health"
